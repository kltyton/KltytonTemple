def python = providers.environmentVariable('TEMPLE_PYTHON').getOrElse('python')
def requested = providers.gradleProperty('target').orNull
if (requested == null && file('.temple/active-target').exists()) {
    requested = file('.temple/active-target').getText('UTF-8').trim()
}
tasks.register('listTargets', Exec) {
    group = 'temple'
    commandLine python, 'temple.py', 'list', '--json'
}
tasks.register('build', Exec) {
    group = 'build'
    description = 'Builds selected independent targets using their own Wrapper and configured JDK.'
    def arguments = [python, 'temple.py', 'build']
    if (requested != null) { arguments.addAll('--target', requested) }
    commandLine arguments
}
tasks.register('runClient', Exec) {
    group = 'temple'
    doFirst {
        if (requested == null) { throw new GradleException('Specify -Ptarget=<loader>-<minecraft>.') }
    }
    commandLine python, 'temple.py', 'run', '--target', requested ?: '', '--side', 'client'
}
