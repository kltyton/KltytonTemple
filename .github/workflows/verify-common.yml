name: Build targets
on:
  push:
    paths:
      - 'common/**'
      - 'targets/**'
      - 'buildSrc/**'
      - 'integrations/shared/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'build.gradle'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/verify-common.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: targets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - id: targets
        run: sh gradlew writeCiMatrix --console=plain
  build:
    needs: discover
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix).include }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            ${{ matrix.java }}
            ${{ matrix.gradle_java }}
            21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and inspect production target
        shell: bash
        run: |
          suffix="${{ matrix.target }}"
          suffix=${suffix//-/_}
          suffix=${suffix//./_}
          sh gradlew "build_$suffix" "verify_$suffix" --console=plain -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}-${{ matrix.os }}
          path: targets/${{ matrix.target }}/build/libs/*.jar
          if-no-files-found: error
