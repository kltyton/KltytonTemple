name: Build targets

on:
  push:
    paths:
      - 'common/**'
      - 'versions/**'
      - 'loaders/**'
      - 'targets/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'build.gradle'
      - 'temple.py'
      - 'tools/**'
      - '.github/workflows/verify-common.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: targets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: targets
        run: |
          matrix=$(python temple.py matrix --json)
          echo "matrix=$(echo "$matrix" | python -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps({"include":[dict(t,os=o) for t in d["include"] for o in ("windows-latest","ubuntu-latest")]},separators=(",",":")))')" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix).include }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            ${{ matrix.java }}
            ${{ matrix.gradle_java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build selected target
        shell: bash
        run: python temple.py build --target "${{ matrix.target }}" --log-dir .temple/logs --json
      - name: Check distributable
        shell: bash
        run: python temple.py verify --target "${{ matrix.target }}" --json
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-${{ matrix.os }}
          path: targets/${{ matrix.target }}/build/libs/*.jar
          if-no-files-found: error
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.target }}-${{ matrix.os }}
          path: .temple/logs
          if-no-files-found: ignore
